name: APK Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Resolve version
        shell: bash
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Require signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lumabeat-release.p12"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/lumabeat-release.p12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_TYPE=PKCS12" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Verify and build signed release
        run: ./gradlew testCoreDebugUnitTest lintCoreDebug assembleCoreRelease compileFullDebugKotlin
      - name: Verify signature and prepare assets
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          CORE_MANIFEST="$(find app/build/intermediates/merged_manifests/coreRelease -name AndroidManifest.xml | head -1)"
          test -x "$APKSIGNER"
          test -f "$CORE_MANIFEST"
          if grep -qE 'BIND_NOTIFICATION_LISTENER_SERVICE|MediaNotificationListenerService' "$CORE_MANIFEST"; then
            echo "Core release unexpectedly contains notification-listener access."
            exit 1
          fi
          "$APKSIGNER" verify --verbose app/build/outputs/apk/core/release/app-core-release.apk
          cp app/build/outputs/apk/core/release/app-core-release.apk LumaBeat.apk
          APK_SHA256="$(sha256sum LumaBeat.apk | awk '{print $1}')"
          printf '%s  LumaBeat.apk\n' "$APK_SHA256" > LumaBeat.apk.sha256
          printf '{"schemaVersion":1,"edition":"core","version":"%s","versionCode":%s,"tag":"%s","packageName":"com.lumabeat.app","apk":"https://github.com/thomrnowtea/lumabeat/releases/download/%s/LumaBeat.apk","sha256":"%s"}\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" "$APK_SHA256" > release.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" LumaBeat.apk LumaBeat.apk.sha256 release.json $prerelease --generate-notes --title "LumaBeat $GITHUB_REF_NAME"
